<svg xmlns="http://www.w3.org/2000/svg" width="940" height="320" viewBox="0 0 940 320">
  <title>What overscroll is: finger delta, edge leftover, spring-back offset</title>
  <rect width="940" height="320" fill="#05070D"/>
  <style>
    .box { fill:#0B0F1C; stroke:#232A44; stroke-width:2; }
    .row { fill:#0F1426; }
    .arrow { stroke:#D8C690; stroke-width:3; fill:none; marker-end:url(#ah); }
    .spring { stroke:#6AD8C2; stroke-width:2.5; fill:none; }
    .cap { fill:#B3B9CB; font:15px ui-monospace,Menlo,monospace; }
    .hi { fill:#6AD8C2; font:15px ui-monospace,Menlo,monospace; }
    .step { fill:#525A72; font:13px ui-monospace,Menlo,monospace; letter-spacing:2px; }
    .ghost { stroke:#6AD8C2; stroke-width:1.5; stroke-dasharray:4 5; fill:none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D8C690"/>
    </marker>
  </defs>

  <text x="30" y="34" class="step">1 · SCROLLING</text>
  <rect x="30" y="52" width="240" height="180" class="box" rx="10"/>
  <rect x="46" y="150" width="208" height="14" class="row" rx="3"/>
  <rect x="46" y="172" width="208" height="14" class="row" rx="3"/>
  <rect x="46" y="194" width="208" height="14" class="row" rx="3"/>
  <rect x="46" y="216" width="208" height="14" class="row" rx="3"/>
  <path d="M150,86 L150,140" class="arrow"/>
  <text x="30" y="266" class="cap">finger delta —</text>
  <text x="30" y="286" class="cap">content consumes it</text>

  <text x="350" y="34" class="step">2 · AT THE EDGE</text>
  <rect x="350" y="52" width="240" height="180" class="box" rx="10"/>
  <rect x="366" y="66" width="208" height="14" class="row" rx="3"/>
  <rect x="366" y="88" width="208" height="14" class="row" rx="3"/>
  <rect x="366" y="110" width="208" height="14" class="row" rx="3"/>
  <rect x="366" y="132" width="208" height="14" class="row" rx="3"/>
  <rect x="366" y="154" width="208" height="14" class="row" rx="3"/>
  <path d="M470,196 L470,220" class="arrow"/>
  <path d="M354,236 L586,236" stroke="#E8718A" stroke-width="3"/>
  <text x="350" y="266" class="cap">content full — delta</text>
  <text x="350" y="286" class="cap">has nowhere to go</text>

  <text x="670" y="34" class="step">3 · OVERSCROLL</text>
  <rect x="670" y="52" width="240" height="180" fill="none" stroke="#6AD8C2" stroke-width="2" stroke-dasharray="6 5" rx="10"/>
  <path d="M670,96 L910,96" class="ghost"/>
  <rect x="686" y="122" width="208" height="14" class="row" rx="3"/>
  <rect x="686" y="144" width="208" height="14" class="row" rx="3"/>
  <rect x="686" y="166" width="208" height="14" class="row" rx="3"/>
  <rect x="686" y="188" width="208" height="14" class="row" rx="3"/>
  <rect x="686" y="210" width="208" height="14" class="row" rx="3"/>
  <path d="M790,60 L790,114" class="arrow"/>
  <path d="M700,266 q10,-16 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" class="spring"/>
  <text x="670" y="266" class="cap">leftover becomes</text>
  <text x="670" y="290"><tspan class="hi">overscrollOffset</tspan><tspan class="cap"> — springs back to 0</tspan></text>
</svg>
